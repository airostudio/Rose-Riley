<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid slice">
  <!-- Connection & Flow — overlapping organic circles and flowing curves -->
  <defs>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6B8F71" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6B8F71" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B8906A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#B8906A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Large background circle halos -->
  <circle cx="280"  cy="320"  r="360" fill="url(#glow1)"/>
  <circle cx="1100" cy="580"  r="340" fill="url(#glow2)"/>

  <!-- Outer ring — large -->
  <circle cx="500"  cy="450"  r="340" fill="none" stroke="#4A6A50"  stroke-width="48" opacity="0.5"/>
  <!-- Outer ring — right -->
  <circle cx="950"  cy="450"  r="310" fill="none" stroke="#6B8F71"  stroke-width="36" opacity="0.45"/>
  <!-- Inner overlap ring -->
  <circle cx="700"  cy="450"  r="220" fill="none" stroke="#8DAA93"  stroke-width="24" opacity="0.55"/>
  <!-- Accent warm ring -->
  <circle cx="700"  cy="450"  r="120" fill="none" stroke="#B8906A"  stroke-width="18" opacity="0.5"/>

  <!-- Small satellite circles -->
  <circle cx="200"  cy="150"  r="90"  fill="none" stroke="#6B8F71"  stroke-width="14" opacity="0.4"/>
  <circle cx="1220" cy="200"  r="70"  fill="none" stroke="#8DAA93"  stroke-width="12" opacity="0.4"/>
  <circle cx="180"  cy="720"  r="110" fill="none" stroke="#4A6A50"  stroke-width="16" opacity="0.35"/>
  <circle cx="1230" cy="720"  r="85"  fill="none" stroke="#6B8F71"  stroke-width="12" opacity="0.35"/>

  <!-- Flowing connector curves -->
  <path d="M160,150  C400,50  600,200  700,330"
        stroke="#8DAA93" stroke-width="3" fill="none" opacity="0.5" stroke-dasharray="8,6"/>
  <path d="M1220,200 C1000,120 820,220  700,330"
        stroke="#8DAA93" stroke-width="3" fill="none" opacity="0.5" stroke-dasharray="8,6"/>
  <path d="M290,720  C420,800  580,640  700,570"
        stroke="#B8906A" stroke-width="3" fill="none" opacity="0.45" stroke-dasharray="8,6"/>
  <path d="M1150,720 C1020,800 840,640  700,570"
        stroke="#B8906A" stroke-width="3" fill="none" opacity="0.45" stroke-dasharray="8,6"/>

  <!-- Central filled dot -->
  <circle cx="700"  cy="450"  r="18"  fill="#4A6A50" opacity="0.7"/>
</svg>
