<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid slice">
  <!-- Botanical — large leaf silhouettes -->

  <!-- Far left tall leaf -->
  <g transform="rotate(18, 120, 450)">
    <ellipse cx="120" cy="450" rx="110" ry="420" fill="#4A6A50"/>
    <line x1="120" y1="30" x2="120" y2="870" stroke="#2A3E28" stroke-width="3"/>
  </g>

  <!-- Left mid leaf -->
  <g transform="rotate(-12, 380, 520)">
    <ellipse cx="380" cy="520" rx="140" ry="380" fill="#6B8F71"/>
    <line x1="380" y1="140" x2="380" y2="900" stroke="#3A5438" stroke-width="2.5"/>
  </g>

  <!-- Center tall leaf -->
  <g transform="rotate(5, 700, 400)">
    <ellipse cx="700" cy="400" rx="120" ry="460" fill="#8DAA93"/>
    <line x1="700" y1="-60" x2="700" y2="860" stroke="#3A5438" stroke-width="2"/>
  </g>

  <!-- Right leaf -->
  <g transform="rotate(-18, 1000, 480)">
    <ellipse cx="1000" cy="480" rx="150" ry="400" fill="#6B8F71"/>
    <line x1="1000" y1="80" x2="1000" y2="880" stroke="#2A3E28" stroke-width="3"/>
  </g>

  <!-- Far right tall leaf -->
  <g transform="rotate(22, 1280, 430)">
    <ellipse cx="1280" cy="430" rx="120" ry="480" fill="#4A6A50"/>
    <line x1="1280" y1="-50" x2="1280" y2="910" stroke="#2A3E28" stroke-width="3"/>
  </g>

  <!-- Small accent leaves top -->
  <g transform="rotate(-8, 550, 180)">
    <ellipse cx="550" cy="180" rx="70" ry="195" fill="#8DAA93"/>
  </g>
  <g transform="rotate(14, 860, 220)">
    <ellipse cx="860" cy="220" rx="60" ry="170" fill="#6B8F71"/>
  </g>

  <!-- Ground base organic arc -->
  <path d="M0,820 Q350,760 700,800 Q1050,840 1400,780 L1400,900 L0,900Z" fill="#2A3E28" opacity="0.5"/>
</svg>
